            { id: 1, name: 'Dragon Roll', price: 18.99, inventory: 24, status: 'Active', image: 'dragon-roll', category: 'active' },
            { id: 2, name: 'Sashimi Platter', price: 34.99, inventory: 12, status: 'Active', image: 'sashimi', category: 'active' },
            { id: 3, name: 'Tonkotsu Ramen', price: 16.99, inventory: 0, status: 'Out of Stock', image: 'ramen', category: 'out' },
            { id: 4, name: 'Edamame', price: 6.99, inventory: 48, status: 'Active', image: 'edamame', category: 'active' },
            { id: 5, name: 'Tempura Udon', price: 15.99, inventory: 3, status: 'Draft', image: 'udon', category: 'draft' },
            { id: 6, name: 'Mochi Ice Cream', price: 8.99, inventory: 32, status: 'Active', image: 'mochi', category: 'active' },
        ],
        get filtered() {
            let list = this.products;
            if (this.activeTab !== 'all') list = list.filter(p => p.category === this.activeTab);
            if (this.search) list = list.filter(p => p.name.toLowerCase().includes(this.search.toLowerCase()));
            return list;
        },
        toggleSelect(id) {
            this.selected.includes(id) ? this.selected = this.selected.filter(i => i !== id) : this.selected.push(id);
        },
        toggleAll() {
            if (this.selected.length === this.filtered.length) { this.selected = []; } else { this.selected = this.filtered.map(p => p.id); }
        },
        removeSelected() { this.products = this.products.filter(p => !this.selected.includes(p.id)); this.selected = []; }
    }">

                            <button @click="activeTab = 'active'" :class="activeTab === 'active' ? 'bg-brand-50 text-brand-700' : 'text-content-muted hover:text-content hover:bg-surface-secondary'" class="rounded-2xl px-4 py-2 text-sm font-medium transition-colors">Active</button>
                            <button @click="activeTab = 'draft'" :class="activeTab === 'draft' ? 'bg-brand-50 text-brand-700' : 'text-content-muted hover:text-content hover:bg-surface-secondary'" class="rounded-2xl px-4 py-2 text-sm font-medium transition-colors">Draft</button>
                            <button @click="activeTab = 'out'" :class="activeTab === 'out' ? 'bg-brand-50 text-brand-700' : 'text-content-muted hover:text-content hover:bg-surface-secondary'" class="rounded-2xl px-4 py-2 text-sm font-medium transition-colors">Out of Stock</button>
                        </div>
                    </div>

                    <!-- Bulk action bar -->
                    <div x-show="selected.length > 0" x-cloak x-transition class="mb-4 rounded-2xl border border-brand-200 bg-brand-50 px-4 py-3 flex items-center justify-between">
                        <p class="text-sm font-medium text-brand-700"><span x-text="selected.length"></span> product<span x-text="selected.length > 1 ? 's' : ''"></span> selected</p>
                        <button @click="removeSelected()" class="inline-flex items-center gap-1.5 rounded-xl bg-danger-500 px-3 py-1.5 text-xs font-medium text-white hover:bg-red-600 transition-colors">
                            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                            Delete
                        </button>
                    </div>

                    <!-- Product grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <template x-for="product in filtered" :key="product.id">
                            <div class="rounded-3xl border border-line bg-white overflow-hidden hover:shadow-md transition-shadow">
                                <div class="relative">
                                    <div class="h-44 bg-surface-secondary flex items-center justify-center">
                                        <svg class="h-12 w-12 text-content-muted/30" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/></svg>
                                    </div>
                                    <div class="absolute top-3 left-3">
                                        <label class="inline-flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" :checked="selected.includes(product.id)" @change="toggleSelect(product.id)" class="h-4 w-4 rounded border-line text-brand-600 focus:ring-brand-500">
                                        </label>
                                    </div>
                                    <div class="absolute top-3 right-3">
                                        <span x-show="product.status === 'Active'" class="inline-flex items-center rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-medium text-emerald-700">Active</span>
                                        <span x-show="product.status === 'Draft'" class="inline-flex items-center rounded-full bg-surface-secondary px-2.5 py-0.5 text-xs font-medium text-content-muted">Draft</span>
                                        <span x-show="product.status === 'Out of Stock'" class="inline-flex items-center rounded-full bg-danger-50 px-2.5 py-0.5 text-xs font-medium text-danger-500">Out of Stock</span>
                                    </div>
                                </div>
                                <div class="p-4">
                                    <div class="flex items-start justify-between">
                                        <div>
                                            <h3 class="text-sm font-semibold text-content" x-text="product.name"></h3>
                                            <p class="text-lg font-bold text-content mt-1">$<span x-text="product.price.toFixed(2)"></span></p>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-xs text-content-muted">Inventory</p>
                                            <p class="text-sm font-semibold" :class="product.inventory === 0 ? 'text-danger-500' : product.inventory <= 5 ? 'text-amber-500' : 'text-content'" x-text="product.inventory"></p>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2 mt-4 pt-4 border-t border-line">
                                        <button class="flex-1 inline-flex items-center justify-center gap-1.5 rounded-xl border border-line px-3 py-2 text-xs font-medium text-content hover:bg-surface-secondary transition-colors">
                                            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"/></svg>
                                            Edit
                                        </button>
                                        <button class="inline-flex items-center justify-center rounded-xl border border-line p-2 text-content-muted hover:text-danger-500 hover:border-danger-200 hover:bg-danger-50 transition-colors">
                                            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Empty state -->
                    <div x-show="filtered.length === 0" x-cloak class="text-center py-12">
                        <svg class="mx-auto h-12 w-12 text-content-muted/30" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/></svg>
                        <p class="mt-3 text-sm text-content-muted">No products found.</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
