<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — OmniBusiness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                        emerald: { 50: '#ecfdf5', 500: '#10b981' },
                        surface: { DEFAULT: '#ffffff', secondary: '#f8fafc' },
                        content: { DEFAULT: '#111827', muted: '#6b7280' },
                        line: { DEFAULT: '#e5e7eb' },
                    },
                },
            },
        }
    </script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-surface-secondary text-content antialiased font-sans">

    <div class="flex min-h-screen">
        <!-- Left: Form -->
        <div class="flex flex-1 flex-col justify-center px-6 py-12 sm:px-12 lg:px-20 xl:px-24">
            <div class="mx-auto w-full max-w-sm">
                <a href="index.html" class="flex items-center gap-2.5 mb-10">
                    <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-brand-600 text-white">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349m-16.5 11.65V9.35m0 0a3.001 3.001 0 003.75-.615A2.993 2.993 0 009.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 002.25 1.016c.896 0 1.7-.393 2.25-1.016A3.001 3.001 0 0021 9.349m-18 0V6a2.25 2.25 0 012.25-2.25h15A2.25 2.25 0 0121 6v3.349"/></svg>
                    </div>
                    <span class="text-xl font-semibold tracking-tight text-content">OmniBusiness</span>
                </a>

                <!-- Step 1: Email -->
                <div x-data="{ step: 1, email: '' }">
                    <template x-if="step === 1">
                        <div>
                            <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-3xl bg-brand-50 mb-6">
                                <svg class="h-7 w-7 text-brand-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
                            </div>
                            <h1 class="text-2xl font-bold text-content text-center">Forgot your password?</h1>
                            <p class="mt-2 text-sm text-content-muted text-center">Enter your email and we'll send you a link to reset your password.</p>

                            <form class="mt-8 space-y-5" @submit.prevent="step = 2">
                                <div>
                                    <label for="email" class="block text-sm font-medium text-content mb-1.5">Email address</label>
                                    <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" x-model="email" class="block w-full rounded-2xl border border-line bg-white px-4 py-3 text-sm text-content placeholder:text-content-muted/50 outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100 transition-all">
                                </div>

                                <button type="submit" class="w-full rounded-2xl bg-brand-600 px-4 py-3 text-sm font-semibold text-white hover:bg-brand-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600 transition-all">Send reset link</button>
                            </form>

                            <p class="mt-8 text-center text-sm text-content-muted">
                                Remember your password? <a href="login.html" class="font-semibold text-brand-600 hover:text-brand-700 transition-colors">Sign in</a>
                            </p>
                        </div>
                    </template>

                    <!-- Step 2: Check your email -->
                    <template x-if="step === 2">
                        <div>
                            <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-3xl bg-emerald-50 mb-6">
                                <svg class="h-7 w-7 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg>
                            </div>
                            <h1 class="text-2xl font-bold text-content text-center">Check your email</h1>
                            <p class="mt-2 text-sm text-content-muted text-center">We've sent a password reset link to<br><span class="font-medium text-content" x-text="email"></span></p>

                            <div class="mt-8 space-y-4">
                                <button @click="step = 3" class="w-full rounded-2xl bg-brand-600 px-4 py-3 text-sm font-semibold text-white hover:bg-brand-700 transition-all">Open email app</button>
                                <button @click="step = 1" class="w-full rounded-2xl border border-line bg-white px-4 py-3 text-sm font-medium text-content hover:bg-surface-secondary transition-all">Didn't receive it? Try again</button>
                            </div>

                            <p class="mt-8 text-center text-sm text-content-muted">
                                <a href="login.html" class="font-semibold text-brand-600 hover:text-brand-700 transition-colors">Back to sign in</a>
                            </p>
                        </div>
                    </template>

                    <!-- Step 3: New password -->
                    <template x-if="step === 3">
                        <div x-data="{ showPassword: false, showConfirm: false }">
                            <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-3xl bg-brand-50 mb-6">
                                <svg class="h-7 w-7 text-brand-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
                            </div>
                            <h1 class="text-2xl font-bold text-content text-center">Set new password</h1>
                            <p class="mt-2 text-sm text-content-muted text-center">Must be at least 8 characters long.</p>

                            <form class="mt-8 space-y-5" @submit.prevent="step = 4">
                                <div>
                                    <label for="new_password" class="block text-sm font-medium text-content mb-1.5">New password</label>
                                    <div class="relative">
                                        <input :type="showPassword ? 'text' : 'password'" id="new_password" name="new_password" required placeholder="Enter new password" class="block w-full rounded-2xl border border-line bg-white px-4 py-3 pr-12 text-sm text-content placeholder:text-content-muted/50 outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100 transition-all">
                                        <button type="button" @click="showPassword = !showPassword" class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-content-muted hover:text-content transition-colors">
                                            <svg x-show="!showPassword" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                                            <svg x-show="showPassword" x-cloak class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
                                        </button>
                                    </div>
                                </div>

                                <div>
                                    <label for="confirm_password" class="block text-sm font-medium text-content mb-1.5">Confirm password</label>
                                    <div class="relative">
                                        <input :type="showConfirm ? 'text' : 'password'" id="confirm_password" name="confirm_password" required placeholder="Confirm your password" class="block w-full rounded-2xl border border-line bg-white px-4 py-3 pr-12 text-sm text-content placeholder:text-content-muted/50 outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100 transition-all">
                                        <button type="button" @click="showConfirm = !showConfirm" class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-content-muted hover:text-content transition-colors">
                                            <svg x-show="!showConfirm" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                                            <svg x-show="showConfirm" x-cloak class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
                                        </button>
                                    </div>
                                </div>

                                <button type="submit" class="w-full rounded-2xl bg-brand-600 px-4 py-3 text-sm font-semibold text-white hover:bg-brand-700 transition-all">Reset password</button>
                            </form>
                        </div>
                    </template>

                    <!-- Step 4: Success -->
                    <template x-if="step === 4">
                        <div>
                            <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-3xl bg-emerald-50 mb-6">
                                <svg class="h-7 w-7 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            </div>
                            <h1 class="text-2xl font-bold text-content text-center">Password reset successful</h1>
                            <p class="mt-2 text-sm text-content-muted text-center">Your password has been reset. You can now sign in with your new password.</p>

                            <div class="mt-8">
                                <a href="login.html" class="block w-full rounded-2xl bg-brand-600 px-4 py-3 text-center text-sm font-semibold text-white hover:bg-brand-700 transition-all">Sign in</a>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Right: Illustration -->
        <div class="hidden lg:flex lg:flex-1 lg:items-center lg:justify-center bg-brand-600 relative overflow-hidden">
            <div class="absolute inset-0">
                <div class="absolute top-20 left-20 w-64 h-64 rounded-full bg-brand-500/40 blur-3xl"></div>
                <div class="absolute bottom-20 right-20 w-80 h-80 rounded-full bg-brand-400/30 blur-3xl"></div>
            </div>
            <div class="relative z-10 max-w-md px-8 text-center">
                <div class="mx-auto h-20 w-20 rounded-3xl bg-white/10 backdrop-blur-sm flex items-center justify-center mb-8">
                    <svg class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
                </div>
                <h2 class="text-3xl font-bold text-white">Secure account recovery.</h2>
                <p class="mt-4 text-lg text-brand-100 leading-relaxed">Your account security is our top priority. We'll help you get back in safely.</p>
                <div class="mt-10 space-y-4 text-left">
                    <div class="flex items-center gap-3">
                        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-white/10 flex-shrink-0">
                            <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
                        </div>
                        <span class="text-sm text-brand-100">Encrypted password reset</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-white/10 flex-shrink-0">
                            <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
                        </div>
                        <span class="text-sm text-brand-100">24/7 account support</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-white/10 flex-shrink-0">
                            <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></svg>
                        </div>
                        <span class="text-sm text-brand-100">Two-factor authentication</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
